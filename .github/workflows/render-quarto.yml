name: Test Quarto Rendering

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  render-quarto:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.4'

    - name: Set GITHUB_PAT
      run: echo "GITHUB_PAT=${{ secrets.MY_GITHUB_PAT }}" >> $GITHUB_ENV

    - name: Install system libraries for spatial packages
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgdal-dev \
          libgeos-dev \
          libproj-dev \
          libudunits2-dev

    - name: Setup Quarto
      uses: quarto-dev/quarto-actions/setup@v2

    - name: Cache renv packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/R/renv
          renv/library
        key: renv-${{ hashFiles('renv.lock') }}
        restore-keys: |
          renv-

    - name: Install rcarbon from GitHub
      run: |
        Rscript -e 'install.packages("remotes")'
        Rscript -e 'remotes::install_github("ahb108/rcarbon", upgrade = "never")'

    - name: Restore renv packages
      run: |
        Rscript -e 'install.packages("renv", repos = "https://cloud.r-project.org")'
        Rscript -e 'renv::restore(prompt = FALSE)'

    - name: Render all Quarto files
      run: |
        mkdir -p rendered_html
        find . -name "*.qmd" -type f ! -path "./.git/*" | while read file; do
          echo "=== Rendering: $file ==="
          
          if quarto render "$file" --to html --output-dir rendered_html; then
            echo "Success"
          else
            echo "Failed"
            grep -n "library\|require" "$file" | head -5 || true
            exit 1
          fi
          echo ""
        done

    - name: Upload rendered HTML
      uses: actions/upload-artifact@v4
      with:
        name: rendered-html
        path: rendered_html

  deploy:
    needs: render-quarto
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
    - name: Download rendered HTML
      uses: actions/download-artifact@v4
      with:
        name: rendered-html
        path: site

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: site
        publish_branch: gh-pages
