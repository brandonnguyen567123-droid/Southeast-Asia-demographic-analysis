name: Test Quarto Rendering

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  render-quarto:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup R
      uses: r-lib/actions/setup-r@v2
    
    - name: Setup Quarto
      uses: quarto-dev/quarto-actions/setup@v2
    
    - name: Install common R packages
      run: |
        Rscript -e "install.packages(c('knitr', 'rmarkdown', 'tinytex'), repos = 'https://cloud.r-project.org')"
    
    - name: Render Quarto files with auto-install
      run: |
        # Create a script that tries to render and install missing packages
        cat > render_quarto.R << 'EOF'
        # Function to render a qmd file, installing packages as needed
        render_qmd_with_auto_install <- function(file) {
          cat("Rendering:", file, "\n")
          
          # Try to render
          result <- tryCatch({
            system2("quarto", c("render", shQuote(file), "--to", "html", "--execute"), 
                   stdout = TRUE, stderr = TRUE)
          }, error = function(e) e)
          
          # Check if it failed due to missing package
          if (inherits(result, "error") || any(grepl("there is no package called", result))) {
            # Extract missing package name
            missing_pkg <- NULL
            for (line in result) {
              if (grepl("there is no package called ['\"]([a-zA-Z0-9._]+)['\"]", line)) {
                missing_pkg <- gsub(".*there is no package called ['\"]([a-zA-Z0-9._]+)['\"].*", "\\1", line)
                break
              }
            }
            
            if (!is.null(missing_pkg)) {
              cat("Missing package detected:", missing_pkg, "\n")
              cat("Installing", missing_pkg, "...\n")
              
              tryCatch({
                install.packages(missing_pkg, repos = "https://cloud.r-project.org")
                cat("Successfully installed", missing_pkg, "\n")
                
                # Try rendering again
                cat("Retrying render...\n")
                system2("quarto", c("render", shQuote(file), "--to", "html", "--execute"))
                return(TRUE)
              }, error = function(e) {
                cat("Failed to install", missing_pkg, ":", e$message, "\n")
                return(FALSE)
              })
            } else {
              cat("Failed for unknown reason:\n")
              cat(paste(result, collapse = "\n"), "\n")
              return(FALSE)
            }
          } else {
            cat("Successfully rendered", file, "\n")
            return(TRUE)
          }
        }
        
        # Find and render all .qmd files
        qmd_files <- list.files(pattern = "\\.qmd$", recursive = TRUE, full.names = TRUE)
        qmd_files <- qmd_files[!grepl("\\.git", qmd_files)]
        
        if (length(qmd_files) == 0) {
          cat("No .qmd files found\n")
          quit(save = "no", status = 0)
        }
        
        cat("Found", length(qmd_files), "Quarto files\n")
        
        failed_files <- c()
        
        for (file in qmd_files) {
          success <- render_qmd_with_auto_install(file)
          if (!success) {
            failed_files <- c(failed_files, file)
          }
          cat("\n")
        }
        
        if (length(failed_files) > 0) {
          cat("Failed to render the following files:\n")
          cat(paste(failed_files, collapse = "\n"), "\n")
          quit(save = "no", status = 1)
        } else {
          cat("All files rendered successfully!\n")
          quit(save = "no", status = 0)
        }
        EOF
        
        # Run the render script
        Rscript render_quarto.R
