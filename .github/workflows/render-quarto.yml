name: Test Quarto Rendering

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  render-quarto:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup R
      uses: r-lib/actions/setup-r@v2
    
    - name: Install spatial system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgdal-dev \
          libgeos-dev \
          libproj-dev \
          libudunits2-dev \
          libsqlite3-dev
        
    - name: Setup Quarto
      uses: quarto-dev/quarto-actions/setup@v2
    
    - name: Install R packages from DESCRIPTION or install.R
      run: |
        # Install remotes first
        Rscript -e "install.packages('remotes', repos = 'https://cloud.r-project.org')"
        
        # If there's an install.R file, use it
        if [ -f "install.R" ]; then
          echo "Using install.R to install packages"
          Rscript install.R
        # If there's a DESCRIPTION file, use remotes
        elif [ -f "DESCRIPTION" ]; then
          echo "Installing dependencies from DESCRIPTION"
          Rscript -e "remotes::install_deps(dependencies = TRUE)"
        # Otherwise install common packages
        else
          echo "Installing common packages"
          Rscript -e "
            pkgs <- c('knitr', 'rmarkdown', 'tinytex', 'ggplot2', 'dplyr', 'tidyr')
            install.packages(pkgs, repos = 'https://cloud.r-project.org')
          "
        fi
    
    - name: Install sf and rcarbon with system dependencies
      run: |
        Rscript -e "
          # Install spatial packages
          spatial_pkgs <- c('units', 'sf', 'terra')
          
          for (pkg in spatial_pkgs) {
            if (!requireNamespace(pkg, quietly = TRUE)) {
              cat('Installing', pkg, '...\n')
              install.packages(pkg, repos = 'https://cloud.r-project.org', configure.args = c(
                '--with-gdal-config=/usr/bin/gdal-config',
                '--with-geos-config=/usr/bin/geos-config',
                '--with-proj-include=/usr/include',
                '--with-proj-lib=/usr/lib/x86_64-linux-gnu'
              ))
            }
          }
          
          # Install rcarbon from GitHub
          if (!requireNamespace('rcarbon', quietly = TRUE)) {
            cat('Installing rcarbon from GitHub...\n')
            remotes::install_github('ahb108/rcarbon')
          }
        "
    
    - name: Render Quarto files
      run: |
        # Simple render all .qmd files
        find . -name "*.qmd" -type f ! -path "./.git/*" | while read file; do
          echo "Rendering: $file"
          quarto render "$file" --to html || {
            echo "::error::Failed to render $file"
            exit 1
          }
        done
