name: Test Quarto Rendering

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  render-quarto:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.3'

    # Make your PAT available to R, pak, remotes, etc.
    - name: Set GITHUB_PAT
      run: echo "GITHUB_PAT=${{ secrets.MY_GITHUB_PAT }}" >> $GITHUB_ENV
    
    - name: Install system libraries for spatial packages
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgdal-dev \
          libgeos-dev \
          libproj-dev \
          libudunits2-dev
        
    - name: Setup Quarto
      uses: quarto-dev/quarto-actions/setup@v2

    # Install rcarbon from GitHub BEFORE anything else
    - name: Install rcarbon from GitHub
      run: |
        Rscript -e 'install.packages("remotes")'
        Rscript -e 'remotes::install_github("ahb108/rcarbon", upgrade = "never")'

    - name: Install R packages from package list
      run: |
        # Create a simple installation script
        cat > install_packages.R << 'EOF'
        # List of packages to install (rcarbon removed)
        packages <- c(
          # Quarto essentials
          "knitr",
          "rmarkdown",
          "tinytex",
          
          # Tidyverse
          "tidyverse",
          
          # Spatial packages
          "sf",
          "terra",
          "units"
        )
        
        cat("Installing packages...\n")
        
        # Try CRAN first
        for (pkg in packages) {
          cat("Installing", pkg, "... ")
          tryCatch({
            install.packages(pkg, repos = "https://cloud.r-project.org", quiet = TRUE)
            cat("✓\n")
          }, error = function(e) {
            cat("✗ (CRAN failed:", e$message, ")\n")
          })
        }
        
        # Verify installation
        cat("\nVerifying installation:\n")
        for (pkg in packages) {
          status <- requireNamespace(pkg, quietly = TRUE)
          cat(pkg, ":", if (status) "✓" else "✗", "\n")
        }
        EOF
        
        Rscript install_packages.R
    
    - name: Render all Quarto files
      run: |
        find . -name "*.qmd" -type f ! -path "./.git/*" | while read file; do
          echo "=== Rendering: $file ==="
          
          if quarto render "$file" --to html; then
            echo "✅ Success"
          else
            echo "❌ Failed"
            echo "Checking for missing packages in file:"
            grep -n "library\|require" "$file" | head -5 || true
            exit 1
          fi
          echo ""
        done
