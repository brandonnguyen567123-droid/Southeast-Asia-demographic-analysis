name: Test Quarto Rendering

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  render-quarto:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.3'
    
    - name: Install system tools
      run: sudo apt-get install -y curl jq
    
    - name: Setup Quarto
      uses: quarto-dev/quarto-actions/setup@v2
    
    - name: Install R packages
      run: |
        # Install basic Quarto dependencies
        Rscript -e "install.packages(c('knitr', 'rmarkdown', 'tinytex', 'stringr'), repos = 'https://cloud.r-project.org')"
        
        # Install packages from DESCRIPTION if it exists
        if [ -f "DESCRIPTION" ]; then
          Rscript -e "install.packages('remotes'); remotes::install_deps()"
        fi
        
        # Simple package detection from .qmd files
        Rscript -e "
          # Find .qmd files
          files <- list.files(pattern = '\\\\.qmd$', recursive = TRUE, full.names = TRUE)
          if (length(files) > 0) {
            cat('Found', length(files), 'Quarto files\\n')
            
            # Common R packages for Quarto
            common_pkgs <- c('ggplot2', 'dplyr', 'tidyr', 'readr', 'purrr', 'tibble')
            
            # Install common packages
            installed <- rownames(installed.packages())
            needed <- setdiff(common_pkgs, installed)
            if (length(needed) > 0) {
              cat('Installing common packages:', paste(needed, collapse = ', '), '\\n')
              install.packages(needed, repos = 'https://cloud.r-project.org')
            }
          }
        "
    
    - name: Render Quarto files
      run: |
        # Find and render all .qmd files
        find . -name "*.qmd" -type f ! -path "./.git/*" | while read file; do
          echo "Rendering: $file"
          quarto render "$file" --to html || {
            echo "Failed to render: $file"
            exit 1
          }
        done
