name: Test Quarto Rendering

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  render-quarto:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.3'
    
    - name: Install system libraries for spatial packages
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgdal-dev \
          libgeos-dev \
          libproj-dev \
          libudunits2-dev
        
    - name: Setup Quarto
      uses: quarto-dev/quarto-actions/setup@v2

    - name: Install rcarbon from GitHub
      run: |
         Rscript -e 'remotes::install_github("ahb108/rcarbon", upgrade = "never")'
    
    - name: Install R packages from package list
      run: |
        # Create a simple installation script
        cat > install_packages.R << 'EOF'
        # List of packages to install
        packages <- c(
          # Quarto essentials
          "knitr",
          "rmarkdown",
          "tinytex",
          
          # Tidyverse
          "tidyverse",
          
          # Spatial packages
          "sf",
          "terra",
          "units",
          
          # rcarbon and dependencies
          "rcarbon"
        )
        
        cat("Installing packages...\n")
        
        # Try CRAN first
        for (pkg in packages) {
          cat("Installing", pkg, "... ")
          tryCatch({
            install.packages(pkg, repos = "https://cloud.r-project.org", quiet = TRUE)
            cat("✓\n")
          }, error = function(e) {
            cat("✗ (CRAN failed:", e$message, ")\n")
            
            # For rcarbon specifically, try different methods
            if (pkg == "rcarbon") {
              cat("  Trying alternative methods for rcarbon...\n")
              
              # Method 1: Install from CRAN archive
              tryCatch({
                cat("  Method 1: CRAN archive... ")
                url <- "https://cran.r-project.org/src/contrib/Archive/rcarbon/rcarbon_1.5.0.tar.gz"
                install.packages(url, repos = NULL, type = "source")
                cat("✓\n")
              }, error = function(e1) {
                cat("✗\n")
                
                # Method 2: Install dependencies manually
                tryCatch({
                  cat("  Method 2: Manual install... ")
                  # Download and install manually
                  temp_file <- tempfile(fileext = ".tar.gz")
                  download.file("https://cran.r-project.org/src/contrib/rcarbon_1.5.0.tar.gz", temp_file)
                  install.packages(temp_file, repos = NULL, type = "source")
                  cat("✓\n")
                }, error = function(e2) {
                  cat("✗\n")
                })
              })
            }
          })
        }
        
        # Verify installation
        cat("\nVerifying installation:\n")
        for (pkg in packages) {
          status <- requireNamespace(pkg, quietly = TRUE)
          cat(pkg, ":", if (status) "✓" else "✗", "\n")
        }
        EOF
        
        Rscript install_packages.R
    
    - name: Render all Quarto files
      run: |
        # Simple render command
        find . -name "*.qmd" -type f ! -path "./.git/*" | while read file; do
          echo "=== Rendering: $file ==="
          
          # Try to render
          if quarto render "$file" --to html; then
            echo "✅ Success"
          else
            echo "❌ Failed"
            
            # Check for missing packages
            echo "Checking for missing packages in file:"
            grep -n "library\|require" "$file" | head -5 || true
            
            exit 1
          fi
          echo ""
        done
